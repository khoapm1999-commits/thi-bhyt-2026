<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Thi BHYT 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f4f6f8;color:#1f2937;font-family:Arial,Helvetica,sans-serif}
body{-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.brand{font-weight:700;line-height:1.3;max-width:72%;font-size:14px}
.timer{min-width:104px;text-align:center;font-size:20px;font-weight:800;padding:8px 10px;border-radius:10px;background:#111827;color:#fff}
.timer.danger{background:#b91c1c}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.hidden{display:none!important}
.login{max-width:620px;margin:28px auto}
h2{margin-top:0}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{-webkit-appearance:none;appearance:none;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:#fff;color:#111827}
button{-webkit-appearance:none;appearance:none;border:0;border-radius:9px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
.primary{background:#2563eb;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
.dangerBtn{background:#dc2626;color:#fff}
button:disabled{opacity:.55}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.question-title{font-size:20px;font-weight:800;margin-bottom:18px;line-height:1.45}
.option{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid #dbe2ea;border-radius:10px;margin:10px 0;background:#fff}
.option.selected{border-color:#2563eb;background:#eff6ff}
.option input{-webkit-appearance:radio;appearance:radio;width:auto;margin-top:3px}
.navrow{margin-top:22px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.side{position:sticky;top:78px}
.stats{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.qbtn{padding:8px 0;border:1px solid #cbd5e1;background:#fff;color:#111827;border-radius:7px;font-size:13px}
.qbtn.answered{background:#dcfce7;border-color:#16a34a}
.qbtn.current{outline:3px solid #2563eb}
.notice{padding:12px;border-radius:9px;background:#fff7ed;border:1px solid #fdba74;margin:12px 0}
.oknotice{padding:12px;border-radius:9px;background:#ecfdf5;border:1px solid #86efac;margin:12px 0;color:#166534}
.errnotice{padding:12px;border-radius:9px;background:#fef2f2;border:1px solid #fca5a5;margin:12px 0;color:#991b1b}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.9);z-index:99;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;text-align:center;padding:24px}
.result{text-align:center;max-width:650px;margin:50px auto}
@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static;order:-1}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media(max-width:520px){
  .wrap{padding:10px}
  .card{padding:14px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .brand{font-size:12px}
  .timer{font-size:18px;min-width:90px}
}
</style>
</head>
<body>

<div id="loading" class="loading">Đang kiểm tra hệ thống...</div>

<div id="topbar" class="topbar hidden">
  <div>
    <div class="brand" id="examTitle"></div>
    <div id="candidateLine" style="font-size:13px;color:#64748b;margin-top:3px"></div>
  </div>
  <div id="timer" class="timer">60:00</div>
</div>

<div class="wrap">

  <div id="loginView" class="card login hidden">
    <h2>Thông tin thí sinh</h2>

    <div id="connectionBox" class="oknotice">
      Kết nối hệ thống: bình thường.
    </div>

    <div class="notice">
      Sau khi bấm <b>Bắt đầu làm bài</b>, đồng hồ 60 phút sẽ chạy liên tục.
      Hết giờ hệ thống tự nộp bài.
    </div>

    <label>Họ và tên</label>
    <input id="name" placeholder="Nhập họ và tên">

    <label>Khoa/Phòng</label>
    <input id="department" placeholder="Ví dụ: Khoa Nội, Phòng CNTT...">

    <label>Mã đề</label>
    <select id="examCode"></select>

    <button class="primary" style="margin-top:18px;width:100%" onclick="startExam()">
      Bắt đầu làm bài
    </button>
  </div>

  <div id="examView" class="hidden">
    <div class="layout">

      <div class="card">
        <div id="questionTitle" class="question-title"></div>
        <div id="options"></div>

        <div class="navrow">
          <button class="secondary" id="prevBtn" onclick="goPrev()">← Câu trước</button>
          <button class="secondary" id="nextBtn" onclick="goNext()">Câu sau →</button>
        </div>
      </div>

      <div class="card side">
        <div class="stats">
          <span id="progressText">Đã làm 0/80</span>
          <span id="blankText">Còn 80</span>
        </div>

        <div id="questionGrid" class="grid"></div>

        <button class="dangerBtn" style="margin-top:16px;width:100%" onclick="submitWithConfirm()">
          Nộp bài
        </button>
      </div>

    </div>
  </div>

  <div id="resultView" class="card result hidden">
    <h2>Đã nộp bài</h2>
    <div id="resultStatus">Bạn đã nộp bài thành công.</div>
    <p>Kết quả sẽ được Ban tổ chức tổng hợp và công bố sau.</p>
  </div>

</div>

<script>
/*
 * QUAN TRỌNG:
 * Sau khi Deploy Apps Script backend, thay URL bên dưới bằng link /exec mới.
 */
var API_URL = "https://script.google.com/macros/s/AKfycbxSMXEa6zV5tFob5gNK9zpHLmKhfbZk6_Sj_feHrJz6DvQo9YhBi8A04s6zjfOW037fmA/exec";

var config = null;
var attempt = null;
var answers = {};
var currentIndex = 0;
var timerHandle = null;
var submitting = false;
var jsonpCounter = 0;

var STORAGE_TOKEN = 'bhyt_final_token';
var STORAGE_ANSWERS = 'bhyt_final_answers';

window.onload = function(){
  if (API_URL.indexOf('PASTE_YOUR_') === 0) {
    fatal('Chưa cấu hình API_URL trong index.html.');
    return;
  }

  apiCall('config', {}, function(res){
    if (!res || !res.ok) {
      fatal(res && res.error ? res.error : 'Không tải được cấu hình.');
      return;
    }

    config = res;
    initApp();

  }, fatal);
};

function apiCall(action, params, success, failure){
  var cb = '__examCb' + (++jsonpCounter);
  var script = document.createElement('script');
  var finished = false;

  var timer = setTimeout(function(){
    if (finished) return;
    finished = true;
    cleanup();

    if (failure) failure('Máy chủ phản hồi quá lâu.');
  }, 15000);

  function cleanup(){
    clearTimeout(timer);

    try {
      delete window[cb];
    } catch (e) {
      window[cb] = undefined;
    }

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  }

  window[cb] = function(data){
    if (finished) return;
    finished = true;
    cleanup();
    success(data);
  };

  params = params || {};
  params.action = action;
  params.callback = cb;
  params._t = new Date().getTime();

  var parts = [];

  for (var k in params) {
    if (params.hasOwnProperty(k)) {
      parts.push(
        encodeURIComponent(k) + '=' + encodeURIComponent(params[k])
      );
    }
  }

  script.src =
    API_URL +
    (API_URL.indexOf('?') >= 0 ? '&' : '?') +
    parts.join('&');

  script.onerror = function(){
    if (finished) return;
    finished = true;
    cleanup();

    if (failure) failure('Không kết nối được máy chủ.');
  };

  document.head.appendChild(script);
}

function initApp(){
  document.getElementById('examTitle').innerHTML = esc(config.title);

  var select = document.getElementById('examCode');
  var html = '';

  for (var i = 0; i < config.examCodes.length; i++) {
    html +=
      '<option value="' +
      config.examCodes[i] +
      '">Mã đề ' +
      config.examCodes[i] +
      '</option>';
  }

  select.innerHTML = html;

  var oldToken = safeGet(STORAGE_TOKEN);

  if (oldToken) {
    apiCall(
      'resume',
      {token: oldToken},
      function(res){
        if (res && res.ok && res.found && !res.finished) {
          attempt = res;
          restoreAnswers();
          openExam();
        } else {
          clearLocal();
          showLogin();
        }
      },
      function(){
        clearLocal();
        showLogin();
      }
    );
  } else {
    showLogin();
  }
}

function showLogin(){
  hideLoading();
  document.getElementById('loginView').className = 'card login';
}

function startExam(){
  var name = trimText(document.getElementById('name').value);
  var department = trimText(document.getElementById('department').value);
  var examCode = Number(document.getElementById('examCode').value);

  if (!name || !department) {
    alert('Vui lòng nhập đầy đủ Họ và tên và Khoa/Phòng.');
    return;
  }

  showLoading('Đang khởi tạo bài thi...');

  apiCall(
    'start',
    {
      name: name,
      department: department,
      examCode: examCode
    },
    function(res){
      if (!res || !res.ok) {
        hideLoading();
        alert(res && res.error ? res.error : 'Không bắt đầu được bài thi.');
        return;
      }

      attempt = res;
      answers = {};
      currentIndex = 0;

      safeSet(STORAGE_TOKEN, attempt.token);
      saveAnswers();

      openExam();
    },
    function(err){
      hideLoading();
      alert(err);
    }
  );
}

function openExam(){
  if (!attempt || !attempt.questions || !attempt.questions.length) {
    fatal('Không nhận được dữ liệu câu hỏi.');
    return;
  }

  document.getElementById('loginView').className = 'card login hidden';
  document.getElementById('resultView').className = 'card result hidden';
  document.getElementById('examView').className = '';
  document.getElementById('topbar').className = 'topbar';

  document.getElementById('candidateLine').innerHTML =
    esc(attempt.name) +
    ' • ' +
    esc(attempt.department) +
    ' • Mã đề ' +
    attempt.examCode;

  buildGrid();
  renderQuestion();
  updateStats();
  startTimer();
  hideLoading();
}

function buildGrid(){
  var grid = document.getElementById('questionGrid');
  grid.innerHTML = '';

  for (var i = 0; i < attempt.questions.length; i++) {
    (function(idx){
      var q = attempt.questions[idx];

      var b = document.createElement('button');
      b.className = 'qbtn';
      b.innerHTML = String(q.displayNo);
      b.id = 'grid_' + q.qid;

      b.onclick = function(){
        currentIndex = idx;
        renderQuestion();
      };

      grid.appendChild(b);

    })(i);
  }
}

function renderQuestion(){
  var q = attempt.questions[currentIndex];

  document.getElementById('questionTitle').innerHTML =
    'Câu ' +
    q.displayNo +
    '. ' +
    esc(q.q);

  var box = document.getElementById('options');
  box.innerHTML = '';

  for (var i = 0; i < q.opts.length; i++) {
    (function(opt){
      var label = document.createElement('label');

      label.className =
        'option' +
        (answers[q.qid] === opt.key ? ' selected' : '');

      var radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'answer';
      radio.checked = answers[q.qid] === opt.key;

      radio.onchange = function(){
        setAnswer(q.qid, opt.key);
      };

      var text = document.createElement('div');

      text.innerHTML =
        '<b>' +
        esc(opt.displayLabel) +
        '.</b> ' +
        esc(opt.text);

      label.appendChild(radio);
      label.appendChild(text);
      box.appendChild(label);

    })(q.opts[i]);
  }

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled =
    currentIndex === attempt.questions.length - 1;

  refreshGrid();
}

function setAnswer(qid, key){
  answers[String(qid)] = key;

  saveAnswers();
  renderQuestion();
  updateStats();
}

function goPrev(){
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function goNext(){
  if (currentIndex < attempt.questions.length - 1) {
    currentIndex++;
    renderQuestion();
  }
}

function updateStats(){
  var answered = 0;

  for (var i = 0; i < attempt.questions.length; i++) {
    var qid = String(attempt.questions[i].qid);

    if (answers[qid]) {
      answered++;
    }
  }

  var total = attempt.questions.length;

  document.getElementById('progressText').innerHTML =
    'Đã làm ' + answered + '/' + total;

  document.getElementById('blankText').innerHTML =
    'Còn ' + (total - answered);

  refreshGrid();
}

function refreshGrid(){
  for (var i = 0; i < attempt.questions.length; i++) {
    var q = attempt.questions[i];
    var b = document.getElementById('grid_' + q.qid);

    if (!b) continue;

    b.className = 'qbtn';

    if (answers[String(q.qid)]) {
      b.className += ' answered';
    }

    if (i === currentIndex) {
      b.className += ' current';
    }
  }
}

function startTimer(){
  if (timerHandle) {
    clearInterval(timerHandle);
  }

  tickTimer();
  timerHandle = setInterval(tickTimer, 1000);
}

function tickTimer(){
  if (!attempt || submitting) return;

  var remaining = Math.max(
    0,
    Number(attempt.expiresAt) - new Date().getTime()
  );

  var sec = Math.floor(remaining / 1000);
  var mm = Math.floor(sec / 60);
  var ss = sec % 60;

  var el = document.getElementById('timer');

  el.innerHTML =
    pad2(mm) +
    ':' +
    pad2(ss);

  if (remaining <= 5 * 60 * 1000) {
    el.className = 'timer danger';
  }

  if (remaining <= 0) {
    clearInterval(timerHandle);
    alert('Đã hết thời gian. Hệ thống sẽ tự nộp bài.');
    submitNow(true);
  }
}

function compactAnswers(){
  var arr = [];

  for (var k in answers) {
    if (answers.hasOwnProperty(k) && answers[k]) {
      arr.push(k + answers[k]);
    }
  }

  return arr.join(',');
}

function submitWithConfirm(){
  var answered = 0;

  for (var i = 0; i < attempt.questions.length; i++) {
    if (answers[String(attempt.questions[i].qid)]) {
      answered++;
    }
  }

  var blank = attempt.questions.length - answered;

  var msg =
    blank > 0
    ? 'Bạn còn ' + blank + ' câu chưa trả lời. Vẫn nộp bài?'
    : 'Bạn chắc chắn muốn nộp bài?';

  if (confirm(msg)) {
    submitNow(false);
  }
}

function submitNow(isAuto){
  if (submitting) return;

  submitting = true;

  if (timerHandle) {
    clearInterval(timerHandle);
  }

  showLoading(
    isAuto
      ? 'Hết giờ - đang tự nộp bài...'
      : 'Đang nộp bài...'
  );

  apiCall(
    'submit',
    {
      token: attempt.token,
      answers: compactAnswers()
    },
    function(res){
      if (!res || !res.ok) {
        submitting = false;
        hideLoading();

        alert(
          res && res.error
            ? res.error
            : 'Chưa nộp được bài.'
        );

        startTimer();
        return;
      }

      showResult(res);
    },
    function(err){
      submitting = false;
      hideLoading();
      alert('Chưa nộp được bài: ' + err);
      startTimer();
    }
  );
}

function showResult(res){
  clearLocal();
  submitting = false;
  hideLoading();

  document.getElementById('examView').className = 'hidden';
  document.getElementById('topbar').className = 'topbar hidden';
  document.getElementById('resultView').className = 'card result';

  document.getElementById('resultStatus').innerHTML =
    esc(
      res && res.message
        ? res.message
        : 'Bạn đã nộp bài thành công.'
    );
}

function saveAnswers(){
  safeSet(STORAGE_ANSWERS, JSON.stringify(answers));
}

function restoreAnswers(){
  try {
    answers = JSON.parse(
      safeGet(STORAGE_ANSWERS) || '{}'
    );
  } catch (e) {
    answers = {};
  }
}

function clearLocal(){
  safeRemove(STORAGE_TOKEN);
  safeRemove(STORAGE_ANSWERS);
}

function safeSet(k, v){
  try {
    localStorage.setItem(k, v);
  } catch (e) {}
}

function safeGet(k){
  try {
    return localStorage.getItem(k);
  } catch (e) {
    return null;
  }
}

function safeRemove(k){
  try {
    localStorage.removeItem(k);
  } catch (e) {}
}

function showLoading(text){
  var el = document.getElementById('loading');
  el.innerHTML = esc(text || 'Đang xử lý...');
  el.className = 'loading';
}

function hideLoading(){
  document.getElementById('loading').className =
    'loading hidden';
}

function fatal(msg){
  hideLoading();

  document.getElementById('loginView').className =
    'card login';

  document.getElementById('connectionBox').className =
    'errnotice';

  document.getElementById('connectionBox').innerHTML =
    'Không kết nối được hệ thống.<br>' +
    esc(
      msg && msg.message
        ? msg.message
        : msg
    );
}

function trimText(s){
  return String(s || '').replace(/^\s+|\s+$/g, '');
}

function pad2(n){
  return n < 10 ? '0' + n : String(n);
}

function esc(s){
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
</script>
</body>
</html>
